apiVersion: manus-dei/v2
name: next-react-boilerplate

# The app is a standalone Next.js repository. The session image comes from
# the environment profile, not from the repository's production Dockerfile.
# The next-node24 profile supplies Node 24 and PostgreSQL 18.
environment:
  profile: next-node24
  version: "upstream-d85859deec"

workspace: template
preview:
  port: 3000

install:
  - npm ci

opencode:
  mode: connect
  model: litellm/hephaestus

resources:
  cpus: "4"
  memory: 6g
  pids: 1024

qa:
  test_dir: tests/e2e
  config: playwright.config.ts

secrets:
  - OPENCODE_API_KEY
