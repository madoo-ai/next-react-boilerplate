apiVersion: manus-dei/v2
name: next-react-boilerplate

# The app is a standalone Next.js repository. The session image comes from
# the environment profile, not from the repository's production Dockerfile.
# laravel-php85 supplies Node 22, PostgreSQL 18, and the common base tools
# this app needs today (the app requires Node 22 or newer).
environment:
  profile: laravel-php85
  version: "2026.10"

workspace: template
preview:
  port: 3000

install:
  - npm ci

opencode:
  mode: connect
  model: opencode/deepseek-v4.1-flash

resources:
  cpus: "4"
  memory: 6g
  pids: 1024

secrets:
  - OPENCODE_API_KEY
