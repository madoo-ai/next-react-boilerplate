apiVersion: manus-dei/v2
name: next-react-boilerplate

# The app is a standalone Next.js repository. The session image comes from
# the environment profile, not from the repository's production Dockerfile.
# The next-node24 profile supplies Node 24 and PostgreSQL 18.
environment:
  profile: next-node24
  version: "upstream-0fa69c156f"

workspace: template
preview:
  port: 3000

install:
  - npm ci

opencode:
  mode: connect
  model: opencode/deepseek-v4.1-flash

resources:
  cpus: "4"
  memory: 6g
  pids: 1024

secrets:
  - OPENCODE_API_KEY
